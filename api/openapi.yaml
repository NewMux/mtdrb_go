openapi: 3.1.0

info:
  title: CoachPulse API
  version: "1.0.0"
  description: |
    The API behind CoachPulse — a business operating system for independent
    personal trainers.

    Two conventions run through everything here and are worth reading before
    the endpoints.

    **Money is integer minor units.** Every amount is a whole number of cents,
    fils or agorot, paired with an ISO-4217 code. There are no floats. A
    ledger that rounds is a ledger that cannot be reconciled.

    **Errors carry a stable machine code.** Clients branch on `error.code`,
    never on `error.message`: the message is for humans and may be reworded,
    the code is part of the contract. `insufficient_credits` carries the
    remaining balance in `meta`, which is what lets the app offer a renewal
    at the moment a pack runs out.

    Measurements follow money's lead: loads are grams, RPE is tenths (85 is
    RPE 8.5), body fat is basis points. Display units are the client's choice;
    the stored value never rounds.

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.coachpulse.io
    description: Production

tags:
  - name: Authentication
  - name: Sync
    description: |
      Offline support. Pull mirrors rows into local storage; push carries
      *operations*, not rows — see `PushOperation`.
  - name: Clients
  - name: Media
    description: Progress photos, receipts and signatures. Bytes move directly
      between the device and private storage on presigned URLs.
  - name: Scheduling
  - name: Credits
  - name: Invoices
  - name: Programming
  - name: Public
    description: The unauthenticated shared-invoice link.
  - name: Catalogue
    description: |
      Where the practice works and what it sells. Both mirror to devices as
      the `locations` and `package_offers` collections, and neither is ever
      deleted: archiving keeps last year's sessions and invoices explained.
  - name: Settings
    description: How the practice runs. Mirrored to devices as the `settings`
      collection; changed by the owner.
  - name: Subscription
    description: |
      Plan state. A trial is fourteen days of everything. A lapsed account is
      read-only rather than locked: every GET keeps working, and writes —
      sync push included, refused whole — answer `402 subscription_inactive`
      until the plan is renewed.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Authentication]
      summary: Liveness
      description: Deliberately does not touch the database — a liveness probe
        that fails on a database blip restarts a healthy process.
      security: []
      responses:
        "200": { description: Alive }

  /readyz:
    get:
      tags: [Authentication]
      summary: Readiness
      security: []
      responses:
        "200": { description: Ready to serve }
        "503": { description: Database unreachable }

  /v1/auth/signup:
    post:
      tags: [Authentication]
      summary: Register a trainer and their business
      description: Provisions the tenant, its owner, its chart of accounts and
        its exercise library in one transaction.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: |
            Wrong password and unknown account are deliberately
            indistinguishable, so this endpoint cannot be used to discover
            which emails are registered.

            With two-step sign-in on, a right password answers
            `mfa_required` with `meta.mfa_token`: exchange it, with the code
            from the authenticator app, at `/v1/auth/mfa`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a new pair
      description: |
        Refresh tokens rotate on every use and are tracked as a family.
        Presenting one that has already been rotated means two parties hold
        it, so the entire family is revoked and the response is
        `refresh_token_reused`.

        The web build sends an empty body and `X-Refresh-Transport: cookie`;
        the token comes from its httpOnly cookie instead.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/session/me:
    get:
      tags: [Authentication]
      summary: Who the current token authenticates
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
                  subject_id: { type: string, format: uuid }
                  kind: { type: string, enum: [user, client] }
                  role: { type: string }

  /v1/session/logout:
    post:
      tags: [Authentication]
      summary: Revoke this device's token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Signed out }

  /v1/auth/mfa:
    post:
      tags: [Authentication]
      summary: Finish a two-step sign-in
      description: The code is either the current one from the authenticator
        app or one of the single-use recovery codes. A code already used is
        refused even inside its thirty seconds.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string, description: From the login's `mfa_required` meta }
                code: { type: string, examples: ["492039", "7KQ2M-X9PDA"] }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Email a password-reset link
      description: Accepted whether or not the address has an account, so the
        endpoint cannot be used to find out who does. The link works once,
        for an hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Sent if the address is registered }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/password/reset:
    post:
      tags: [Authentication]
      summary: Set a new password from a reset link
      description: Signs out every device, since whoever asked for the reset
        may not be the only one who knew the old password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "204": { description: Password changed }
        "400":
          description: A weak password, or `reset_link_invalid` for a link
            that has expired or been used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/session/profile:
    get:
      tags: [Authentication]
      summary: The signed-in trainer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    patch:
      tags: [Authentication]
      summary: Change name or email
      description: Changing the email needs the current password — it is where
        a reset link would go.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                email: { type: string, format: email }
                current_password: { type: string, format: password }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/session/password:
    post:
      tags: [Authentication]
      summary: Change the password
      description: Signs out every other device; this one stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, minLength: 12 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/session/mfa/setup:
    post:
      tags: [Authentication]
      summary: Start two-step sign-in
      description: Generates a secret for an authenticator app. Not in force
        until confirmed with a code at `/enable`, so a botched scan cannot
        lock anyone out.
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFASetup" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/session/mfa/enable:
    post:
      tags: [Authentication]
      summary: Turn two-step sign-in on
      description: The recovery codes in the answer are shown this once and
        stored only as hashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: On
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string, examples: ["7KQ2M-X9PDA"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/session/mfa/disable:
    post:
      tags: [Authentication]
      summary: Turn two-step sign-in off
      description: Takes the password, not a code — the trainer who lost their
        phone is the one who needs this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "204": { description: Off }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/session/devices:
    get:
      tags: [Authentication]
      summary: Signed-in devices
      responses:
        "200":
          description: Most recently used first
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }

  /v1/session/devices/{deviceID}:
    parameters:
      - { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Authentication]
      summary: Sign a device out
      responses:
        "204": { description: Signed out }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/session/devices/sign-out-others:
    post:
      tags: [Authentication]
      summary: Sign out every other device
      responses:
        "204": { description: Signed out }

  /v1/locations:
    get:
      tags: [Catalogue]
      summary: The practice's places, primary first
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  locations:
                    type: array
                    items: { $ref: "#/components/schemas/Location" }
    post:
      tags: [Catalogue]
      summary: Add a place
      description: The first place a practice adds is its primary. Counts
        against the plan's location limit (`plan_limit_reached`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/locations/{locationID}:
    parameters:
      - { name: locationID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Catalogue]
      summary: Change a place
      description: Setting `is_primary` moves the primary here from wherever it was.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/locations/{locationID}/archive:
    parameters:
      - { name: locationID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Catalogue]
      summary: Retire a place
      description: Its sessions keep pointing at it. The primary cannot be
        archived while another place could take over.
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/locations/{locationID}/restore:
    parameters:
      - { name: locationID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Catalogue]
      summary: Bring a place back
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/package-offers:
    get:
      tags: [Catalogue]
      summary: The price list
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items: { $ref: "#/components/schemas/PackageOffer" }
    post:
      tags: [Catalogue]
      summary: Add an offer
      description: Priced in the practice's currency. A session pack needs a
        number of sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageOfferInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/package-offers/{offerID}:
    parameters:
      - { name: offerID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Catalogue]
      summary: Change an offer
      description: What was already sold keeps the terms it was sold on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageOfferInput" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/package-offers/{offerID}/archive:
    parameters:
      - { name: offerID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Catalogue]
      summary: Take an offer off the sell screen
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageOffer" }

  /v1/package-offers/{offerID}/restore:
    parameters:
      - { name: offerID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Catalogue]
      summary: Put an offer back
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageOffer" }

  /v1/settings:
    get:
      tags: [Settings]
      summary: The practice's settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      tags: [Settings]
      summary: Change settings
      description: |
        Owner only. Fields left out are left alone.

        Setting `country` also sets `week_start` to that country's (Sunday in
        Saudi Arabia, Monday in the UAE) and `vat_rate_bp` to its standard
        rate, unless the same change names them.
        `currency` answers `409 currency_locked` once money has been recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200":
          description: The settings as they now stand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/settings/onboarded:
    post:
      tags: [Settings]
      summary: Finish setting up the practice
      description: Owner only. Idempotent; the first time stands.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/subscription:
    get:
      tags: [Subscription]
      summary: The plan, its limits and what is used of them
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }

  /v1/subscription/cancel:
    post:
      tags: [Subscription]
      summary: Stop at the end of the paid period
      description: Owner only. Nothing changes until the period ends.
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/subscription/resume:
    post:
      tags: [Subscription]
      summary: Undo a cancellation
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sync/pull:
    get:
      tags: [Sync]
      summary: Fetch rows changed since a cursor
      description: |
        Returns changed rows per collection. A removal is not a separate
        tombstone: the row comes back with `deleted_at` set, and the client
        drops it locally.

        The cursor is opaque and tracks progress **per collection**. A single
        global sequence cannot work — a page that fills its budget on one
        collection would advance the shared cursor past rows in another, and
        those rows would never be delivered again.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: The token from a previous pull. Omit for a first sync.
        - name: limit
          in: query
          schema: { type: integer, default: 500, maximum: 500 }
        - name: reset
          in: query
          schema: { type: string, examples: ["clients,packages"] }
          description: |
            Comma-separated collections to restart from the beginning. A
            device whose local schema gained columns sends this once: its
            cursor is past rows it stored without the new fields, and the
            cursor is opaque to it, so the server does the resetting.
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullResult" }

  /v1/sync/push:
    post:
      tags: [Sync]
      summary: Drain a device's outbox
      description: |
        Carries operations, not rows. A generic row upsert would bypass the
        business rules — a synced attendance row that did not burn a credit or
        post revenue would leave the calendar and the books disagreeing.

        Returns `200` even when some operations conflict: the batch was
        processed, and each operation carries its own outcome. A blanket
        non-2xx would make the outbox retry the ones that succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  maxItems: 200
                  items: { $ref: "#/components/schemas/PushOperation" }
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }

  /v1/sync/checkpoint:
    get:
      tags: [Sync]
      summary: The current high-water mark
      description: For a client that wants to start syncing from now rather
        than replaying history.
      responses:
        "200":
          description: Cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor: { type: string }

  /v1/clients:
    get:
      tags: [Clients]
      summary: List clients
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ClientStatus" } }
        - { name: search, in: query, schema: { type: string }, description: Matches name, email and phone }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items: { $ref: "#/components/schemas/Client" }
    post:
      tags: [Clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/clients/{clientID}:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Clients]
      summary: Fetch a client
      parameters:
        - name: include_medical
          in: query
          schema: { type: boolean, default: false }
          description: |
            Medical notes are encrypted at rest and returned only when asked
            for explicitly, so an ordinary profile fetch cannot carry them into
            a log or a cache.
      responses:
        "200":
          description: The client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Clients]
      summary: Update a client
      description: |
        Omitting a field leaves it unchanged; sending `null` clears it. The two
        are genuinely different, which is why nullable fields are distinguished
        rather than coalesced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      tags: [Clients]
      summary: Archive a client
      description: A soft delete. Their sessions and invoices are referenced by
        immutable journal entries, so the row is hidden rather than removed.
      responses:
        "204": { description: Archived }

  /v1/clients/{clientID}/biometrics:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Clients]
      summary: Measurement history, newest first
      responses:
        "200":
          description: Measurements
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/BiometricEntry" }
    post:
      tags: [Clients]
      summary: Record a measurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BiometricInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BiometricEntry" }

  /v1/sessions:
    get:
      tags: [Scheduling]
      summary: The calendar over a window
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session_" }
    post:
      tags: [Scheduling]
      summary: Book a session
      description: |
        Refused with `scheduling_conflict` if the slot overlaps an existing
        session including the tenant's buffer. The check is a database
        exclusion constraint, so two devices syncing the same booking cannot
        both win.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_type_id, starts_at]
              properties:
                session_type_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
                client_ids:
                  type: array
                  items: { type: string, format: uuid }
                location_id:
                  type: string
                  format: uuid
                  description: One of the practice's locations; its name is
                    copied into `location`. Archived locations are refused.
                location: { type: string, description: Free text, when no location_id is given }
                notes: { type: string }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session_" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/sessions/attendees/{attendeeID}/mark:
    parameters:
      - { name: attendeeID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Scheduling]
      summary: Record one attendee's outcome
      description: |
        The heart of Journey A. Marking `completed` burns a credit and posts
        `DR Deferred Revenue / CR Training Revenue` in the same transaction —
        either all of it lands or none of it does.

        Attendance is per attendee, not per session: in a semi-private slot one
        client can complete while another no-shows.

        With no credits left the response is `422 insufficient_credits`, and
        `meta.remaining` is what the app uses to offer a renewal.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/AttendanceStatus" }
                notes: { type: string }
                allow_overdraft: { type: boolean }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkResult" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/sessions/mark-day:
    post:
      tags: [Scheduling]
      summary: Bulk roster check-off
      description: |
        Confirms a whole day in one action. Reports who could **not** be marked
        and why, rather than skipping them silently — a trainer tapping "mark
        everyone complete" must not be left believing it worked for a client
        who was out of credit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day: { type: string, format: date }
                status: { $ref: "#/components/schemas/AttendanceStatus" }
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayResult" }

  /v1/sessions/session-types:
    get:
      tags: [Scheduling]
      summary: List bookable session types
      responses:
        "200":
          description: Types
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_types:
                    type: array
                    items: { $ref: "#/components/schemas/SessionType" }
    post:
      tags: [Scheduling]
      summary: Create a session type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, duration_minutes]
              properties:
                name: { type: string }
                duration_minutes: { type: integer }
                capacity: { type: integer, default: 1, description: 1 is one-to-one }
                credit_cost: { type: integer, default: 1 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionType" }

  /v1/credits/clients/{clientID}/balance:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Credits]
      summary: A client's credit position
      description: May be negative — an overdrawn client's debt is shown, not
        hidden behind a zero.
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditBalance" }

  /v1/credits/packages:
    post:
      tags: [Credits]
      summary: Grant a prepaid pack directly
      description: |
        For a comped or migrated pack. A pack sold on an invoice is created by
        issuing that invoice instead, so the liability is not counted twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, credits, unit_price_minor]
              properties:
                client_id: { type: string, format: uuid }
                name: { type: string }
                credits: { type: integer, minimum: 1 }
                unit_price_minor: { type: integer, minimum: 0 }
                currency: { type: string }
                expires_at: { type: string, format: date, nullable: true }
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }

  /v1/invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      parameters:
        - { name: client_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/InvoiceStatus" } }
        - { name: outstanding, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items: { $ref: "#/components/schemas/Invoice" }
    post:
      tags: [Invoices]
      summary: Create a draft
      description: A draft posts nothing and takes no number, so deleting one
        leaves no gap in the numbering.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDraftInput" }
      responses:
        "201":
          description: Drafted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /v1/invoices/{invoiceID}:
    parameters:
      - { name: invoiceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Invoices]
      summary: Fetch an invoice
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
    patch:
      tags: [Invoices]
      summary: Replace a draft's lines and terms
      description: Only a draft can change. An issued invoice is a tax document;
        correcting one means voiding it or, once paid, recording a refund.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDraftInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Invoices]
      summary: Delete a draft
      description: A draft took no number, so deleting it leaves no gap.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/invoices/{invoiceID}/void:
    parameters:
      - { name: invoiceID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Invoices]
      summary: Void an invoice
      description: |
        A draft simply goes; an issued invoice gets a reversing journal entry
        and its package is voided with it. Refused with
        `invalid_state_transition` once anything has been paid against it or
        any of its credits trained off — clawing back delivered training would
        corrupt both ledgers.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Voided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/invoices/{invoiceID}/issue:
    parameters:
      - { name: invoiceID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Invoices]
      summary: Issue a draft
      description: |
        Assigns a gap-free number, posts to the ledger, grants any package
        credits and snapshots the payment instructions — all in one
        transaction.

        A package line credits **Deferred Revenue**, a liability: selling ten
        sessions is not income until they are trained.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                issue_date: { type: string, format: date }
                due_date: { type: string, format: date }
                payment_method_id: { type: string, format: uuid }
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/invoices/{invoiceID}/share:
    parameters:
      - { name: invoiceID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Invoices]
      summary: Mint a shareable link
      description: |
        The token is returned **once**; only its hash is stored. Calling again
        replaces the previous link, which is how a trainer revokes one sent to
        the wrong number.
      responses:
        "201":
          description: Link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  token: { type: string }
    delete:
      tags: [Invoices]
      summary: Revoke the link
      responses:
        "204": { description: Revoked }

  /v1/invoices/{invoiceID}/payments:
    parameters:
      - { name: invoiceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Invoices]
      summary: Payments against this invoice
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
    post:
      tags: [Invoices]
      summary: Record a manual settlement
      description: |
        CoachPulse processes no cards. This records that money arrived
        off-platform and posts `DR Cash|Bank|Wallet / CR Accounts Receivable`.
        Revenue is untouched — receiving money moves it between assets, it does
        not earn it.

        Paying more than is owed is refused with `overpayment`: a negative
        receivable is not a real position.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, instrument]
              properties:
                amount_minor: { type: integer, minimum: 1 }
                currency: { type: string }
                instrument: { $ref: "#/components/schemas/PaymentInstrument" }
                received_on: { type: string, format: date }
                reference: { type: string }
                notes: { type: string }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/Payment" }
                  invoice: { $ref: "#/components/schemas/Invoice" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/receivables:
    get:
      tags: [Invoices]
      summary: Outstanding receivables, aged
      description: Bucketed 1-30 / 31-60 / 60+ days, computed from payments
        rather than a stored balance so it cannot drift.
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receivables" }

  /v1/dashboard:
    get:
      tags: [Dashboard]
      summary: The five numbers a trainer opens the app for
      description: |
        Today's sessions, sessions left this week, unpaid invoices, clients at
        or under the renewal threshold, and income this month.

        Every figure is derived at read time from the ledger and the calendar;
        none is stored, so none can drift. `income_this_month` is **recognised
        revenue** — what was earned by delivering sessions — not cash
        collected. Selling a pack moves nothing here, because a prepaid pack is
        a liability until it is trained off.
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /v1/dashboard/low-balance:
    get:
      tags: [Dashboard]
      summary: Clients who need renewing
      description: |
        Derived on every read rather than stored: a flag would only be as
        truthful as the last job that refreshed it, and this list is read while
        standing in front of the person it concerns.

        Expired packs do not count — a credit that cannot be redeemed is not a
        credit — and an overdrawn client reports a negative balance rather than
        zero, because zero hides the debt.
      parameters:
        - name: threshold
          in: query
          description: Defaults to the tenant's `low_balance_threshold`.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items: { $ref: "#/components/schemas/LowBalanceClient" }
                  threshold: { type: integer }

  /v1/payment-methods:
    get:
      tags: [Invoices]
      summary: How this trainer accepts settlement
      responses:
        "200":
          description: Methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_methods:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentMethod" }
    post:
      tags: [Invoices]
      summary: Add a settlement method
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentMethod" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }

  /v1/exercises:
    get:
      tags: [Programming]
      summary: The exercise library
      description: Seeded per tenant at signup, organised by movement pattern.
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/ExerciseCategory" } }
        - { name: search, in: query, schema: { type: string }, description: Matches name, muscle and equipment }
      responses:
        "200":
          description: Exercises
          content:
            application/json:
              schema:
                type: object
                properties:
                  exercises:
                    type: array
                    items: { $ref: "#/components/schemas/Exercise" }
    post:
      tags: [Programming]
      summary: Add a custom exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                category: { $ref: "#/components/schemas/ExerciseCategory" }
                primary_muscle: { type: string }
                equipment: { type: string }
                instructions: { type: string }
                video_url: { type: string }
                demo_media_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }

  /v1/exercises/{exerciseID}:
    parameters:
      - { name: exerciseID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Programming]
      summary: Archive a custom exercise
      description: Archived rather than deleted, because logged sets reference it.
      responses:
        "204": { description: Archived }

  /v1/programs:
    get:
      tags: [Programming]
      summary: List programmes
      parameters:
        - { name: templates, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Programmes
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items: { $ref: "#/components/schemas/Program" }
    post:
      tags: [Programming]
      summary: Create a programme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                is_template: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }

  /v1/programs/{programID}:
    parameters:
      - { name: programID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Programming]
      summary: A programme with its full structure
      responses:
        "200":
          description: The programme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }

  /v1/workouts:
    post:
      tags: [Programming]
      summary: Open a workout to log sets against
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, format: uuid }
                day_id: { type: string, format: uuid, nullable: true }
                session_id: { type: string, format: uuid, nullable: true }
                week_number: { type: integer, default: 1 }
                performed_on: { type: string, format: date }
      responses:
        "201":
          description: Opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }

  /v1/workouts/{workoutID}/sets:
    parameters:
      - { name: workoutID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Log a set
      description: |
        Upserts on (workout, exercise, set index). Correcting a mistyped weight
        does not create a second set three, and an outbox replay converges
        rather than accumulating.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLogInput" }
      responses:
        "200":
          description: Logged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetLog" }

  /v1/workouts/{workoutID}/exercises/{exerciseID}/clone-previous:
    parameters:
      - { name: workoutID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: exerciseID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Prefill from last session
      description: |
        The single tap. Copies last session's working sets into this workout as
        **not completed**, so the trainer confirms each as it is actually done
        — prefilled numbers that silently counted as performed would put lifts
        in a client's history that never happened. Warm-ups are skipped.
      responses:
        "201":
          description: Prefilled
          content:
            application/json:
              schema:
                type: object
                properties:
                  workout_id: { type: string, format: uuid }
                  cloned_from: { type: string, format: uuid, nullable: true }
                  sets:
                    type: array
                    items: { $ref: "#/components/schemas/SetLog" }
        "404":
          description: This client has not performed this exercise before

  /v1/workouts/{workoutID}/complete:
    parameters:
      - { name: workoutID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Finish a workout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }

  /v1/workouts/clients/{clientID}/exercises/{exerciseID}/progression:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: exerciseID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Programming]
      summary: Volume history for one lift
      description: Working sets only — counting warm-ups and uncompleted sets
        would make a deload read as a personal best.
      responses:
        "200":
          description: Progression
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items: { $ref: "#/components/schemas/VolumePoint" }

  /public/invoices/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Public]
      summary: A shared invoice
      description: |
        The only unauthenticated surface. Serves HTML to a browser and JSON
        when `Accept` asks for it.

        The payload is deliberately narrow — the bill and how to pay it, and
        nothing else. A revoked or forged token is a 404, never a 403: the
        difference would confirm to a guesser that a token once existed.
      security: []
      responses:
        "200":
          description: The invoice
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/PublicInvoice" }
        "404": { description: No such link }


  # -------------------------------------------------------------------------
  # Clients: tags, readiness, waivers
  # -------------------------------------------------------------------------
  /v1/clients/tags:
    get:
      tags: [Clients]
      summary: The tenant's client tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
    post:
      tags: [Clients]
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                colour: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }

  /v1/clients/tags/{tagID}:
    parameters:
      - { name: tagID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Clients]
      summary: Delete a tag, removing it from every client
      responses:
        "204": { description: Deleted }

  /v1/clients/{clientID}/tags:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Clients]
      summary: Replace a client's tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_ids]
              properties:
                tag_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The client, with its new tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /v1/clients/{clientID}/parq:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Clients]
      summary: The client's most recent PAR-Q
      responses:
        "200":
          description: The latest questionnaire
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParQResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Clients]
      summary: Record a completed PAR-Q
      description: |
        Every one of the seven standard questions must be answered. Any "yes"
        sets `requires_clearance`, and the client stays flagged until medical
        clearance is recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: { $ref: "#/components/schemas/ParQAnswer" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParQResponse" }

  /v1/clients/{clientID}/waivers:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Clients]
      summary: The waivers this client has signed
      responses:
        "200":
          description: Signatures
          content:
            application/json:
              schema:
                type: object
                properties:
                  signatures:
                    type: array
                    items: { $ref: "#/components/schemas/WaiverSignature" }

  /v1/clients/{clientID}/waivers/{waiverID}/sign:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: waiverID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Clients]
      summary: Record a client's signature
      description: The exact text signed is copied onto the signature, so a
        later revision of the waiver cannot change what was agreed to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed_name]
              properties:
                signed_name: { type: string }
                signature_media_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaiverSignature" }

  /v1/waivers:
    get:
      tags: [Clients]
      summary: Waiver documents
      parameters:
        - { name: active, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Waivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  waivers:
                    type: array
                    items: { $ref: "#/components/schemas/Waiver" }
    post:
      tags: [Clients]
      summary: Publish a waiver
      description: A waiver with the same title becomes a new version; the old
        one stays attached to the signatures made against it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }

  # -------------------------------------------------------------------------
  # Media
  # -------------------------------------------------------------------------
  /v1/media/uploads:
    post:
      tags: [Media]
      summary: Ask for a presigned upload URL
      description: |
        The bytes go straight to storage, never through the API. Portal
        clients may call this too; their uploads are always attached to
        themselves, whatever `client_id` says.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, content_type, byte_size]
              properties:
                kind: { $ref: "#/components/schemas/MediaKind" }
                content_type: { type: string, examples: [image/jpeg] }
                byte_size: { type: integer, format: int64 }
                client_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Upload ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUpload" }

  /v1/media/{objectID}/confirm:
    parameters:
      - { name: objectID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Media]
      summary: Confirm an upload landed
      responses:
        "200":
          description: The confirmed object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaObject" }

  /v1/media/{objectID}/download:
    parameters:
      - { name: objectID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Media]
      summary: A short-lived download URL
      description: Minted only after the row is read under row-level security,
        so authorisation happens before the URL exists.
      responses:
        "200":
          description: Download
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDownload" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/media/{objectID}:
    parameters:
      - { name: objectID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Media]
      summary: Delete an object and its bytes
      responses:
        "204": { description: Deleted }

  /v1/media/clients/{clientID}:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Media]
      summary: A client's media of one kind
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/MediaKind" } }
      responses:
        "200":
          description: Objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items: { $ref: "#/components/schemas/MediaObject" }

  # -------------------------------------------------------------------------
  # Scheduling
  # -------------------------------------------------------------------------
  /v1/sessions/recurring:
    post:
      tags: [Scheduling]
      summary: Book a recurring series
      description: |
        Materialises one session per occurrence. Occurrences that clash with
        an existing booking are skipped and reported rather than failing the
        whole series: a three-month series will usually hit something.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_type_id, weekdays, starts_on, ends_on, time_of_day, timezone]
              properties:
                session_type_id: { type: string, format: uuid }
                client_ids:
                  type: array
                  items: { type: string, format: uuid }
                weekdays:
                  type: array
                  description: 0 is Sunday.
                  items: { type: integer, minimum: 0, maximum: 6 }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                time_of_day: { type: string, examples: ["07:30"] }
                timezone: { type: string, examples: [Asia/Dubai] }
                location_id: { type: string, format: uuid }
                location: { type: string }
      responses:
        "201":
          description: The series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurResult" }

  /v1/sessions/{sessionID}:
    parameters:
      - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Scheduling]
      summary: Fetch a session with its attendees
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session_" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Scheduling]
      summary: Cancel a session
      description: Frees the slot. Attendance already marked stands — a credit
        correctly burned is not silently refunded.
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{sessionID}/reschedule:
    parameters:
      - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Scheduling]
      summary: Move a session
      description: Re-checks the buffer at the new time; refused with
        `scheduling_conflict` on a clash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at]
              properties:
                starts_at: { type: string, format: date-time }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session_" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/sessions/{sessionID}/attendees:
    parameters:
      - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Scheduling]
      summary: Add a client to a session
      description: Refused when the session is at its type's capacity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, format: uuid }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attendee" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/payment-methods/{methodID}:
    parameters:
      - { name: methodID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Invoices]
      summary: Archive a payment method
      description: Invoices already issued keep the instructions they printed.
      responses:
        "204": { description: Archived }

  # -------------------------------------------------------------------------
  # Programming
  # -------------------------------------------------------------------------
  /v1/programs/{programID}/duplicate:
    parameters:
      - { name: programID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Copy a programme, structure and all
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Program" }

  /v1/programs/{programID}/blocks:
    parameters:
      - { name: programID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Add a block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, weeks]
              properties:
                name: { type: string }
                weeks: { type: integer, minimum: 1 }
                notes: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramBlock" }

  /v1/programs/blocks/{blockID}/days:
    parameters:
      - { name: blockID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Add a training day to a block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                notes: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramDay" }

  /v1/programs/days/{dayID}/exercises:
    parameters:
      - { name: dayID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Prescribe an exercise on a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exercise_id, target_sets]
              properties:
                exercise_id: { type: string, format: uuid }
                target_sets: { type: integer, minimum: 1 }
                target_reps_min: { type: integer, nullable: true }
                target_reps_max: { type: integer, nullable: true }
                target_load_grams: { type: integer, nullable: true }
                target_rpe_tenths: { type: integer, nullable: true }
                target_rir: { type: integer, nullable: true }
                rest_seconds: { type: integer, nullable: true }
                tempo: { type: string }
                superset_group: { type: string }
                notes: { type: string }
      responses:
        "201":
          description: Prescribed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prescription" }

  /v1/programs/{programID}/assign:
    parameters:
      - { name: programID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Programming]
      summary: Put a client on a programme
      description: Any programme the client was following is completed first —
        a client follows one plan at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, format: uuid }
                starts_on: { type: string, format: date, nullable: true }
                ends_on: { type: string, format: date, nullable: true }
                notes: { type: string }
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramAssignment" }

  /v1/workouts/{workoutID}:
    parameters:
      - { name: workoutID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Programming]
      summary: Fetch a workout with its sets
      responses:
        "200":
          description: The workout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workouts/clients/{clientID}/history:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Programming]
      summary: A client's workouts, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Workouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  workouts:
                    type: array
                    items: { $ref: "#/components/schemas/Workout" }

  /v1/workouts/clients/{clientID}/exercises/{exerciseID}/previous:
    parameters:
      - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: exerciseID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Programming]
      summary: What the client did last time on this exercise
      description: Working sets only, so a warm-up is never offered as the
        number to beat.
      responses:
        "200":
          description: The previous performance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviousPerformance" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RefreshTransport:
      name: X-Refresh-Transport
      in: header
      schema: { type: string, enum: [cookie] }
      description: |
        `cookie` puts the refresh token in an httpOnly, SameSite=Strict
        cookie instead of the body, for the web build — a browser has nowhere
        safe to keep one. Refresh and logout then read it from the cookie.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, minLength: 8, maxLength: 255 }
      description: |
        Makes a mutating request safe to retry, which is what lets the offline
        outbox retry aggressively. A replay returns the stored response
        verbatim with `Idempotent-Replay: true`. Reusing a key with a
        *different* body is refused with `idempotency_key_reused`.

  responses:
    Forbidden:
      description: |
        Not allowed. `feature_not_in_plan` (meta: `feature`, `plan`) and
        `plan_limit_reached` (meta: `limit`, `max`, `plan`) are the ones the
        app answers with an upgrade prompt.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PaymentRequired:
      description: |
        `subscription_inactive`: the trial or plan has lapsed and the account
        is read-only until it is renewed. The app's outbox keeps its
        operations waiting rather than marking them refused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: "`rate_limited`: too many attempts; wait and try again."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BadRequest:
      description: Malformed or failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: |
        No such resource in this tenant. Cross-tenant access returns 404 rather
        than 403, so existence is not leaked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: A state precondition was violated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Understood, but business rules refuse it
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable and part of the contract — branch on this, not on the
                message.
              examples: [insufficient_credits, overpayment, scheduling_conflict,
                         invoice_not_payable, invalid_state_transition,
                         idempotency_key_reused, validation_failed]
            message: { type: string, description: For humans; may be reworded }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Per-field validation detail
            meta:
              type: object
              additionalProperties: true
              description: |
                Structured context the client can act on. An
                `insufficient_credits` refusal carries `remaining` and
                `required`, which is what drives the renewal prompt.
            request_id: { type: string }

    Session:
      type: object
      properties:
        account:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            tenant_id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
            role: { type: string }
            currency: { type: string }
        tokens:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_at: { type: string, format: date-time }
            token_type: { type: string, examples: [Bearer] }
            refresh_expires_at:
              type: string
              format: date-time
              description: When this device is signed out if unused — the
                practice's session timeout from now.

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [studio, gym, outdoor, client_home, online] }
        address: { type: string }
        region: { type: string, description: Emirate or region }
        colour: { type: [string, "null"], examples: ["#c8ff00"] }
        is_primary: { type: boolean }
        archived_at: { type: [string, "null"], format: date-time }

    LocationInput:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [studio, gym, outdoor, client_home, online] }
        address: { type: string }
        region: { type: string }
        colour: { type: string, description: "#rrggbb, or empty for none" }
        is_primary: { type: boolean }

    PackageOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [session_pack, monthly_coaching, online_coaching, semi_private] }
        credits: { type: [integer, "null"], description: Sessions included; null for coaching sold by time }
        price_minor: { type: integer, format: int64 }
        currency: { type: string }
        price_includes_vat: { type: boolean }
        validity_days: { type: [integer, "null"], description: Days the credits last; null never expires }
        cycle: { type: string, enum: [one_off, weekly, monthly, annual] }
        session_type_id: { type: [string, "null"], format: uuid }
        sort_order: { type: integer }
        archived_at: { type: [string, "null"], format: date-time }

    PackageOfferInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [session_pack, monthly_coaching, online_coaching, semi_private] }
        credits: { type: integer, minimum: 1 }
        clear_credits: { type: boolean }
        price_minor: { type: integer, format: int64, minimum: 0 }
        price_includes_vat: { type: boolean }
        validity_days: { type: integer, minimum: 1 }
        clear_validity: { type: boolean }
        cycle: { type: string, enum: [one_off, weekly, monthly, annual] }
        session_type_id: { type: string, format: uuid }
        clear_session_type: { type: boolean }
        sort_order: { type: integer }

    Profile:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { type: string }
        mfa_enabled: { type: boolean }
        password_changed_at: { type: [string, "null"], format: date-time }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        signed_in_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean, description: The device asking }

    MFASetup:
      type: object
      properties:
        secret: { type: string, description: Base32, for typing in by hand }
        otpauth_uri: { type: string, description: For a QR code or a tap on the phone itself }

    WorkingHours:
      type: object
      description: Weekday ("0" = Sunday … "6") to "HH:MM" intervals. A day
        absent is a day off.
      additionalProperties:
        type: array
        items:
          type: array
          items: { type: string, examples: ["06:00"] }
          minItems: 2
          maxItems: 2

    Targets:
      type: object
      properties:
        monthly_revenue_minor: { type: integer, format: int64 }
        weekly_sessions: { type: integer }
        active_clients: { type: integer }

    Automations:
      type: object
      properties:
        renewal_due: { type: boolean }
        overdue_invoice: { type: boolean }
        inactive_client: { type: boolean }
        programme_ending: { type: boolean }
        inactive_after_days: { type: integer }

    Settings:
      type: object
      properties:
        business_name: { type: string }
        currency: { type: string }
        currency_locked: { type: boolean, description: True once money has been recorded }
        timezone: { type: string, examples: [Asia/Dubai] }
        country: { type: [string, "null"], examples: [AE] }
        language: { type: string, enum: [en, ar] }
        document_language: { type: string, enum: [en, ar, bilingual] }
        digits: { type: string, enum: [latn, arab] }
        week_start: { type: integer, minimum: 0, maximum: 6 }
        working_hours: { $ref: "#/components/schemas/WorkingHours" }
        targets: { $ref: "#/components/schemas/Targets" }
        automations: { $ref: "#/components/schemas/Automations" }
        session_timeout_days: { type: integer }
        buffer_minutes: { type: integer }
        allow_overdraft: { type: boolean }
        no_show_is_billable: { type: boolean }
        low_balance_threshold: { type: integer }
        vat_registered: { type: boolean }
        trn: { type: [string, "null"], description: Tax registration number, 15 digits }
        vat_rate_bp: { type: integer, description: "Basis points: 500 is 5%" }
        prices_include_vat: { type: boolean }
        onboarded_at:
          type: [string, "null"]
          format: date-time
          description: When the owner finished setting up; the app walks them through it until then.

    SettingsPatch:
      type: object
      properties:
        business_name: { type: string }
        currency: { type: string }
        timezone: { type: string }
        country: { type: string }
        language: { type: string, enum: [en, ar] }
        document_language: { type: string, enum: [en, ar, bilingual] }
        digits: { type: string, enum: [latn, arab] }
        week_start: { type: integer, minimum: 0, maximum: 6 }
        working_hours: { $ref: "#/components/schemas/WorkingHours" }
        targets: { $ref: "#/components/schemas/Targets" }
        automations: { $ref: "#/components/schemas/Automations" }
        session_timeout_days: { type: integer, minimum: 1, maximum: 365 }
        buffer_minutes: { type: integer, minimum: 0, maximum: 240 }
        allow_overdraft: { type: boolean }
        no_show_is_billable: { type: boolean }
        low_balance_threshold: { type: integer, minimum: 0, maximum: 100 }
        vat_registered: { type: boolean, description: Needs a TRN }
        trn:
          type: string
          description: Fifteen digits; beginning 100 in the UAE, beginning and ending 3 in
            Saudi Arabia. Spaces and dashes are ignored; empty clears it.
        vat_rate_bp: { type: integer, minimum: 0, maximum: 10000 }
        prices_include_vat: { type: boolean }

    Subscription:
      type: object
      properties:
        plan: { type: string, enum: [trial, starter, pro] }
        effective_plan:
          type: string
          enum: [starter, pro]
          description: Whose entitlements apply — Pro during a trial.
        status: { type: string, enum: [active, past_due, cancelled] }
        trial_ends_at: { type: [string, "null"], format: date-time }
        trial_days_left: { type: [integer, "null"] }
        renews_on: { type: [string, "null"], format: date }
        cancel_at_period_end: { type: boolean }
        lapsed: { type: boolean, description: Read-only until renewed }
        features:
          type: array
          items: { type: string, enum: [shop, analytics, insights, automations] }
        limits:
          type: object
          description: Caps by resource; a resource absent here is unlimited.
          properties:
            active_clients: { type: integer }
            locations: { type: integer }
        usage:
          type: object
          properties:
            active_clients: { type: integer }
            locations: { type: integer }

    SignupRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        display_name: { type: string }
        business_name: { type: string }
        currency: { type: string, default: USD }
        timezone: { type: string, examples: [Europe/Berlin] }

    PullResult:
      type: object
      properties:
        cursor:
          type: string
          description: Opaque. Store it and send it back unchanged.
        has_more:
          type: boolean
          description: Pull again immediately rather than waiting.
        server_time: { type: string, format: date-time }
        changes:
          type: array
          items:
            type: object
            properties:
              collection: { type: string }
              rows:
                type: array
                items: { type: object, additionalProperties: true }

    PushOperation:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
          description: Minted by the device, so a replay is recognisable.
        type: { $ref: "#/components/schemas/OperationType" }
        queued_at:
          type: string
          format: date-time
          description: |
            When the device recorded it. A batch applies in queued order, not
            arrival order, so two attendance marks resolve to the trainer's
            later decision.
        data: { type: object, additionalProperties: true }

    OperationType:
      type: string
      enum:
        - attendance.mark
        - workout.start
        - workout.log_set
        - workout.complete
        - payment.record
        - client.create
        - client.update
        - biometrics.record

    PushResult:
      type: object
      properties:
        applied: { type: integer }
        conflicts:
          type: integer
          description: |
            Refused on business grounds — out of credit, invoice already
            settled. Surfaced to the trainer rather than resolved, because a
            machine guessing at what someone meant to do with money is worse
            than asking.
        rejected: { type: integer }
        cursor: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              type: { $ref: "#/components/schemas/OperationType" }
              status: { type: string, enum: [applied, conflict, rejected] }
              result: { type: object, additionalProperties: true }
              code: { type: string }
              message: { type: string }

    ClientStatus:
      type: string
      enum: [lead, active, paused, archived]

    Client:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/ClientStatus" }
        emergency_contact_name: { type: string, nullable: true }
        emergency_contact_phone: { type: string, nullable: true }
        medical_notes:
          type: string
          nullable: true
          description: Only present when requested with `include_medical=true`.
        allow_overdraft: { type: boolean, nullable: true }
        default_rate_minor: { type: integer, nullable: true }
        notes: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        server_seq: { type: integer, format: int64 }

    ClientInput:
      type: object
      properties:
        full_name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/ClientStatus" }
        emergency_contact_name: { type: string, nullable: true }
        emergency_contact_phone: { type: string, nullable: true }
        medical_notes: { type: string, nullable: true }
        allow_overdraft: { type: boolean, nullable: true }
        default_rate_minor: { type: integer, nullable: true }
        notes: { type: string }
        tag_ids:
          type: array
          items: { type: string, format: uuid }

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        colour: { type: string, nullable: true }

    BiometricEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        measured_on: { type: string, format: date }
        weight_grams: { type: integer, nullable: true }
        body_fat_bp:
          type: integer
          nullable: true
          description: Basis points — 1550 is 15.50%.
        circumferences:
          type: object
          additionalProperties: { type: integer }
          description: Millimetres, keyed by site.
        notes: { type: string }

    BiometricInput:
      type: object
      properties:
        measured_on: { type: string, format: date }
        weight_grams: { type: integer, nullable: true }
        body_fat_bp: { type: integer, nullable: true }
        circumferences:
          type: object
          additionalProperties: { type: integer }
        notes: { type: string }

    SessionType:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        duration_minutes: { type: integer }
        capacity: { type: integer }
        credit_cost: { type: integer }
        colour: { type: string, nullable: true }

    Session_:
      type: object
      description: A booked slot on the calendar.
      properties:
        id: { type: string, format: uuid }
        session_type_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled] }
        location_id: { type: [string, "null"], format: uuid }
        location:
          type: string
          description: The place's name as it was at booking, or free text.
        notes: { type: string }
        attendees:
          type: array
          items: { $ref: "#/components/schemas/Attendee" }
        server_seq: { type: integer, format: int64 }

    AttendanceStatus:
      type: string
      enum: [scheduled, completed, late_cancel, early_cancel, no_show]

    Attendee:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        client_name: { type: string }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
        credits_charged: { type: integer }
        marked_at: { type: string, format: date-time, nullable: true }
        notes: { type: string }

    MarkResult:
      type: object
      properties:
        attendee: { $ref: "#/components/schemas/Attendee" }
        credits_remaining:
          type: integer
          description: |
            After the change. Journey A turns on this number — at zero the app
            offers a renewal invoice.
        revenue_recognised: { $ref: "#/components/schemas/Money" }
        journal_entry_id: { type: string, format: uuid, nullable: true }

    DayResult:
      type: object
      properties:
        marked:
          type: array
          items: { $ref: "#/components/schemas/MarkResult" }
        skipped:
          type: array
          items:
            type: object
            properties:
              attendee_id: { type: string, format: uuid }
              client_id: { type: string, format: uuid }
              client_name: { type: string }
              reason: { type: string }
              message: { type: string }

    Money:
      type: object
      nullable: true
      properties:
        minor:
          type: integer
          format: int64
          description: Whole minor units — cents, fils, agorot. Never a float.
        currency: { type: string, minLength: 3, maxLength: 3 }

    Package:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        credits_total: { type: integer }
        credits_remaining: { type: integer }
        unit_price_minor: { type: integer }
        currency: { type: string }
        purchased_on: { type: string, format: date }
        expires_at: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, exhausted, expired, void] }

    CreditBalance:
      type: object
      properties:
        client_id: { type: string, format: uuid }
        remaining:
          type: integer
          description: May be negative when a client is overdrawn.
        next_expiry: { type: string, format: date, nullable: true }
        packages:
          type: array
          items: { $ref: "#/components/schemas/Package" }

    InvoiceStatus:
      type: string
      enum: [draft, issued, partially_paid, settled, void]

    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        client_name: { type: string }
        number: { type: string, nullable: true, description: Assigned at issue; gap-free }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        paid_minor: { type: integer, format: int64 }
        balance_minor: { type: integer, format: int64 }
        issue_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        is_overdue:
          type: boolean
          description: Derived from the due date and balance, never stored.
        days_overdue: { type: integer }
        notes: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        payment_instructions:
          $ref: "#/components/schemas/PaymentInstructions"
          description: |
            Frozen at issue. An invoice keeps the IBAN it was sent with even if
            the trainer later changes banks.
        journal_entry_id: { type: string, format: uuid, nullable: true }
        issued_at: { type: string, format: date-time, nullable: true }
        settled_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        void_reason: { type: string }
        has_share_link: { type: boolean }
        server_seq: { type: integer, format: int64 }

    PaymentInstructions:
      type: object
      nullable: true
      properties:
        methods:
          type: array
          items: { $ref: "#/components/schemas/PaymentMethod" }
        reference:
          type: string
          description: What the client should write on the transfer — the invoice number.
        note: { type: string }

    InvoiceLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [package, service]
          description: |
            A package line sells prepaid credits and credits Deferred Revenue;
            a service line bills work already done and credits revenue
            directly.
        description: { type: string }
        quantity: { type: integer }
        unit_price_minor: { type: integer, format: int64 }
        amount_minor: { type: integer, format: int64 }
        package_credits: { type: integer, nullable: true }
        credits_expire_on: { type: string, format: date, nullable: true }
        sort_order: { type: integer }

    InvoiceDraftInput:
      type: object
      required: [client_id, lines]
      properties:
        client_id: { type: string, format: uuid }
        currency: { type: string }
        due_date: { type: string, format: date, nullable: true }
        notes: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unit_price_minor]
            properties:
              kind: { type: string, enum: [package, service], default: service }
              description: { type: string }
              quantity: { type: integer, minimum: 1 }
              unit_price_minor: { type: integer, minimum: 0 }
              package_credits:
                type: integer
                nullable: true
                description: >-
                  Credits granted per unit; the pack is worth
                  quantity x package_credits. Ten sessions at 50.00 each is
                  quantity 10, unit_price_minor 5000, package_credits 1 — not
                  package_credits 10, which grants a hundred.
                  Required on a package line, forbidden on a service line.
              credits_expire_on: { type: string, format: date, nullable: true }

    LowBalanceClient:
      type: object
      properties:
        client_id: { type: string, format: uuid }
        client_name: { type: string }
        remaining:
          type: integer
          description: May be negative when the client is overdrawn.
        next_expiry: { type: string, format: date, nullable: true }
        last_session_on:
          type: string
          format: date
          nullable: true
          description: >-
            Distinguishes "about to run out" from "stopped coming" — the same
            balance, very different conversations.

    DashboardSummary:
      type: object
      properties:
        sessions_today:
          type: integer
          description: Attendees, not slots. A semi-private with three people is three.
        sessions_today_unmarked: { type: integer }
        sessions_left_this_week:
          type: integer
          description: From now to the end of the week, so it shrinks through the day.
        unpaid_invoices: { type: integer }
        outstanding: { $ref: "#/components/schemas/Money" }
        low_balance_count: { type: integer }
        low_balance:
          type: array
          items: { $ref: "#/components/schemas/LowBalanceClient" }
        low_balance_threshold: { type: integer }
        income_this_month:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Recognised revenue month to date, not cash collected.
        currency: { type: string }

    PaymentInstrument:
      type: string
      enum: [cash, bank_transfer, cheque, digital_wallet]
      description: Decides which asset account is debited.

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        instrument: { $ref: "#/components/schemas/PaymentInstrument" }
        received_on: { type: string, format: date }
        reference: { type: string }
        notes: { type: string }

    PaymentMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [bank_transfer, digital_wallet, cash, cheque, other]
        label: { type: string }
        details:
          type: object
          description: |
            Structured settlement fields. Which ones matter varies by country
            and by app.
          properties:
            account_holder: { type: string }
            bank_name: { type: string }
            iban: { type: string }
            swift_bic: { type: string }
            account_number: { type: string }
            routing_number: { type: string }
            handle: { type: string, description: A P2P tag or link }
        instructions: { type: string }
        is_default: { type: boolean }

    Receivables:
      type: object
      properties:
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        overdue_minor: { type: integer, format: int64 }
        not_yet_due_minor: { type: integer, format: int64 }
        outstanding_count: { type: integer }
        buckets:
          type: array
          items:
            type: object
            properties:
              label: { type: string, examples: ["1-30 days"] }
              from_days: { type: integer }
              to_days: { type: integer }
              amount_minor: { type: integer, format: int64 }
              invoice_count: { type: integer }

    PublicInvoice:
      type: object
      description: What an unauthenticated visitor may see — the bill and how
        to pay it, and nothing else.
      properties:
        number: { type: string }
        business_name: { type: string }
        client_name: { type: string }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        paid_minor: { type: integer, format: int64 }
        balance_minor: { type: integer, format: int64 }
        issue_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        is_overdue: { type: boolean }
        notes: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              quantity: { type: integer }
              unit_price_minor: { type: integer, format: int64 }
              amount_minor: { type: integer, format: int64 }
        payment_instructions:
          type: object
          properties:
            reference: { type: string, description: The invoice number }
            methods:
              type: array
              items: { $ref: "#/components/schemas/PaymentMethod" }

    ExerciseCategory:
      type: string
      description: Movement pattern, not muscle — how a coach checks a session
        is balanced.
      enum: [squat, hinge, lunge, horizontal_push, vertical_push,
             horizontal_pull, vertical_pull, carry, core, olympic,
             conditioning, mobility, other]

    Exercise:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: "#/components/schemas/ExerciseCategory" }
        primary_muscle: { type: string }
        equipment: { type: string }
        instructions: { type: string }
        video_url:
          type: string
          description: YouTube or Vimeo only — allowlisted, not format-checked.
        is_custom: { type: boolean }

    Program:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        is_template: { type: boolean }
        total_weeks: { type: integer }
        blocks:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              weeks:
                type: integer
                description: |
                  The block's days repeat for this many weeks rather than being
                  stored once per week, so editing week one edits the block.
              days:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    prescriptions:
                      type: array
                      items: { $ref: "#/components/schemas/Prescription" }

    Prescription:
      type: object
      description: What the trainer asked for. What the client did is a SetLog.
      properties:
        id: { type: string, format: uuid }
        exercise_id: { type: string, format: uuid }
        exercise_name: { type: string }
        target_sets: { type: integer }
        target_reps_min: { type: integer, nullable: true }
        target_reps_max: { type: integer, nullable: true }
        target_load_grams: { type: integer, nullable: true }
        target_rpe_tenths:
          type: integer
          nullable: true
          description: Tenths — 85 is RPE 8.5.
        target_rir: { type: integer, nullable: true }
        rest_seconds: { type: integer, nullable: true }
        tempo: { type: string, examples: ["3-1-1-0"] }
        superset_group: { type: string }
        notes: { type: string }

    Workout:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        day_id: { type: string, format: uuid, nullable: true }
        day_name: { type: string }
        session_id: { type: string, format: uuid, nullable: true }
        week_number: { type: integer }
        performed_on: { type: string, format: date }
        status: { type: string, enum: [in_progress, completed, skipped] }
        notes: { type: string }
        sets:
          type: array
          items: { $ref: "#/components/schemas/SetLog" }
        server_seq: { type: integer, format: int64 }

    SetLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        exercise_id: { type: string, format: uuid }
        exercise_name: { type: string }
        set_index: { type: integer, minimum: 1 }
        reps: { type: integer, nullable: true }
        load_grams: { type: integer, nullable: true, description: Grams — never rounds }
        rpe_tenths: { type: integer, nullable: true }
        rir: { type: integer, nullable: true }
        rest_seconds: { type: integer, nullable: true }
        tempo: { type: string }
        is_warmup:
          type: boolean
          description: Excluded from progression, so a warm-up cannot read as a PB.
        completed: { type: boolean }
        notes: { type: string }
        form_check_media_id: { type: string, format: uuid, nullable: true }

    SetLogInput:
      type: object
      required: [exercise_id, set_index]
      properties:
        exercise_id: { type: string, format: uuid }
        program_exercise_id: { type: string, format: uuid, nullable: true }
        set_index: { type: integer, minimum: 1 }
        reps: { type: integer, nullable: true }
        load_grams: { type: integer, nullable: true }
        rpe_tenths: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        rir: { type: integer, nullable: true, minimum: 0, maximum: 10 }
        rest_seconds: { type: integer, nullable: true }
        tempo: { type: string }
        is_warmup: { type: boolean }
        completed: { type: boolean, default: true }
        notes: { type: string }
        form_check_media_id: { type: string, format: uuid, nullable: true }

    VolumePoint:
      type: object
      properties:
        performed_on: { type: string, format: date }
        volume_gram_reps:
          type: integer
          format: int64
          description: Load times reps over working sets — the number coaches
            watch for progression.
        top_set_grams: { type: integer, nullable: true }
        working_sets: { type: integer }

    ParQQuestion:
      type: string
      enum: [heart_condition, chest_pain_activity, chest_pain_rest, loses_balance_dizziness,
             bone_or_joint_problem, blood_pressure_medication, other_reason]

    ParQAnswer:
      type: object
      required: [question, "yes"]
      properties:
        question: { $ref: "#/components/schemas/ParQQuestion" }
        "yes": { type: boolean }
        detail: { type: string }

    ParQResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        answers:
          type: array
          items: { $ref: "#/components/schemas/ParQAnswer" }
        requires_clearance: { type: boolean }
        cleared_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time }

    Waiver:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        version: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    WaiverSignature:
      type: object
      properties:
        id: { type: string, format: uuid }
        waiver_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        signed_name: { type: string }
        signed_at: { type: string, format: date-time }
        signature_media_id: { type: string, format: uuid, nullable: true }

    MediaKind:
      type: string
      enum: [progress_photo, receipt, signature, form_check_video, exercise_demo, other]

    MediaObject:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/MediaKind" }
        sensitivity:
          type: string
          enum: [standard, sensitive]
          description: Sensitive bytes must never be cached or persisted by a client.
        content_type: { type: string }
        byte_size: { type: integer, format: int64 }
        client_id: { type: string, format: uuid, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    MediaUpload:
      type: object
      properties:
        object: { $ref: "#/components/schemas/MediaObject" }
        upload_url: { type: string }
        expires_at: { type: string, format: date-time }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Send these verbatim, or the signature will not match.

    MediaDownload:
      type: object
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
        sensitive: { type: boolean }

    RecurResult:
      type: object
      properties:
        series_id: { type: string, format: uuid }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session_" }
        skipped:
          type: array
          items:
            type: object
            properties:
              starts_at: { type: string, format: date-time }
              reason: { type: string }

    ProgramBlock:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        weeks: { type: integer }
        sort_order: { type: integer }
        notes: { type: string }
        days:
          type: array
          items: { $ref: "#/components/schemas/ProgramDay" }

    ProgramDay:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        notes: { type: string }
        prescriptions:
          type: array
          items: { $ref: "#/components/schemas/Prescription" }

    ProgramAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        program_id: { type: string, format: uuid }
        program_name: { type: string }
        client_id: { type: string, format: uuid }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        status: { type: string }
        notes: { type: string }
        server_seq: { type: integer, format: int64 }

    PreviousPerformance:
      type: object
      properties:
        exercise_id: { type: string, format: uuid }
        workout_id: { type: string, format: uuid }
        performed_on: { type: string, format: date }
        sets:
          type: array
          items: { $ref: "#/components/schemas/SetLog" }
