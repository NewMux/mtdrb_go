name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GO_VERSION: "1.24"

jobs:
  go:
    name: Go build, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coachpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          # Pass directories, not a glob expansion: gofmt with an empty
          # argument list reads stdin and hangs the job.
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Unit tests
        run: go test -race -count=1 ./...

      # The API role must not bypass RLS, or the isolation tests would pass
      # vacuously. CI provisions it the same way docker-compose does.
      - name: Provision RLS-bound app role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d coachpulse -v ON_ERROR_STOP=1 \
            -f deploy/postgres-init/00-app-role.sql

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/coachpulse?sslmode=disable
        run: go run ./cmd/migrate up

      # Reversibility is a release requirement: a migration that cannot roll
      # back turns a bad deploy into an outage.
      - name: Migrations roll back and reapply
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/coachpulse?sslmode=disable
        run: |
          go run ./cmd/migrate reset
          go run ./cmd/migrate up

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coachpulse?sslmode=disable
          TEST_APP_DATABASE_URL: postgres://coachpulse_app:coachpulse_app@localhost:5432/coachpulse?sslmode=disable
        run: go test -race -count=1 -tags=integration ./...

  sqlc:
    name: Generated code is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - run: sqlc vet
      - name: Generated code matches queries
        run: |
          sqlc generate
          git diff --exit-code internal/db/gen
