name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GO_VERSION: "1.24"

jobs:
  go:
    name: Go build, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coachpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          # Pass directories, not a glob expansion: gofmt with an empty
          # argument list reads stdin and hangs the job.
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      - name: Unit tests
        run: go test -race -count=1 ./...

      # CI sets the database up the way production does, not the way a
      # laptop does. Migrations run as an owner that is NOT a superuser, as on
      # any managed Postgres: a superuser reads past row-level security, and
      # migrating as one hid a bug that stopped anyone signing in on a real
      # deployment. The app role is provisioned with deploy/provision.sql, the
      # script production uses. Test fixtures still connect as postgres.
      - name: Provision like production
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE coachpulse_owner LOGIN PASSWORD 'owner' CREATEROLE" \
            -c "ALTER DATABASE coachpulse OWNER TO coachpulse_owner"
          psql -h localhost -U postgres -d coachpulse -v ON_ERROR_STOP=1 \
            -c "ALTER SCHEMA public OWNER TO coachpulse_owner"
          PGPASSWORD=owner psql -h localhost -U coachpulse_owner -d coachpulse \
            -v app_password=coachpulse_app_ci_password_0000 -f deploy/provision.sql

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://coachpulse_owner:owner@localhost:5432/coachpulse?sslmode=disable
        run: go run ./cmd/migrate up

      # Reversibility is a release requirement: a migration that cannot roll
      # back turns a bad deploy into an outage.
      - name: Migrations roll back and reapply
        env:
          DATABASE_URL: postgres://coachpulse_owner:owner@localhost:5432/coachpulse?sslmode=disable
        run: |
          go run ./cmd/migrate reset
          go run ./cmd/migrate up

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coachpulse?sslmode=disable
          TEST_APP_DATABASE_URL: postgres://coachpulse_app:coachpulse_app_ci_password_0000@localhost:5432/coachpulse?sslmode=disable
        # -p 1: integration packages share one database and reset it
        # between tests, so they must not run concurrently.
        run: go test -race -count=1 -p 1 -tags=integration ./...

  app:
    name: Expo client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # The client's wire types are generated from api/openapi.yaml, and a Go
      # test holds every server route to that file. A stale generated file
      # would let the two drift apart again.
      - name: API types match the spec
        run: |
          npm run api-types
          git diff --exit-code src/api/schema.d.ts

      - name: Typecheck
        run: npx tsc --noEmit

      # node:sqlite is what the offline tests run against, so the real queries
      # are exercised rather than a mock.
      - name: Tests
        run: npx jest --ci

      # Bundling every route is the cheapest check that the screens actually
      # resolve — a broken import passes typecheck and fails at runtime.
      - name: Bundle
        run: npx expo export --platform web --output-dir /tmp/web-export
        env:
          EXPO_NO_TELEMETRY: "1"
