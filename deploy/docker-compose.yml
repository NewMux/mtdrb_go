# Local development stack: Postgres for the ledger, MinIO for receipts and
# progress photos. Both are configured to mirror production constraints that
# matter for correctness — notably that the API connects as a role which does
# NOT bypass row-level security.
services:
  postgres:
    image: postgres:16-alpine
    container_name: coachpulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coachpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coachpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: coachpulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the private bucket the media service expects. Public read is never
  # enabled: every object is served through a short-lived presigned URL.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/coachpulse &&
      mc anonymous set none local/coachpulse &&
      echo 'bucket ready (private)'
      "

volumes:
  postgres-data:
  minio-data:
