# Local development stack: Postgres for the ledger, an S3-compatible store for
# receipts and progress photos. Both are configured to mirror production constraints that
# matter for correctness — notably that the API connects as a role which does
# NOT bypass row-level security.
services:
  postgres:
    image: postgres:16-alpine
    container_name: coachpulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coachpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coachpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for receipts and progress photos. SeaweedFS,
  # not MinIO: MinIO stopped publishing its server images, so minio/minio no
  # longer pulls. The media service speaks plain S3 and was verified against
  # this. Same port and keys as before, so .env.example is unchanged; the API
  # creates the bucket itself (STORAGE_CREATE_BUCKET=true in development).
  storage:
    image: chrislusf/seaweedfs:4.47
    container_name: coachpulse-storage
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json
    ports:
      - "9000:8333"
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
